<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <title>Mascotas</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/logo.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Mascotas
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span id="syncStatus" class="badge bg-secondary ms-2">Comprobando...</span>
                <button id="btnSync" class="btn btn-sm btn-outline-primary"
                    onclick="syncManager.sync()">Sincronizar</button>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Información de mascotas</h1>
        <form id="mascotaForm" class="mb-3">
            <input type="text" id="nombre" placeholder="Nombre de la mascota" class="form-control mb-3" required>
            <select id="tipo" class="form-select mb-3" aria-label="Tipo de mascota" required>
                <option value="" selected disabled>Selecciona el tipo de mascota</option>
                <option value="Perro">Perro</option>
                <option value="Gato">Gato</option>
                <option value="Pajaro">Pajaro</option>
            </select>
            <input type="number" id="edad" placeholder="Edad de la mascota" class="form-control mb-3" min="0" required>
            <button id="btnGuardar" type="submit" class="btn btn-primary">Agregar</button>
            <button id="btnCancelarEdicion" type="button" class="btn btn-secondary d-none">Cancelar</button>
        </form>
        <table class="table mt-3">
            <thead>
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Tipo</th>
                    <th scope="col">Edad</th>
                    <th scope="col">Actualizar</th>
                    <th scope="col">Eliminar</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <div style="padding-left:20px">
        <button id="geoBtn" onclick="getGeoLocation()"
            style="background: none; border: none; cursor: pointer; padding: 0;">
            <i class="fas fa-map-marker-alt" style="font-size: 2rem; color: #1976d2;"></i>
        </button>
    </div>
    <div id="map" style="height: 400px; width: 100%; margin-bottom: 1rem;"></div>

    <div class="d-flex flex-column align-items-center my-4">
        <div class="mb-2">
            <select id="cameraSelect" class="form-select">
                <option value="user">Cámara frontal</option>
                <option value="environment">Cámara trasera</option>
            </select>
        </div>
        <button id="btnCamara" class="btn btn-secondary mb-2">Abrir cámara</button>
        <video id="video" width="320" height="240" autoplay style="display:none; border:1px solid #ccc; border-radius:8px;"></video>
        <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
        <img id="foto" alt="Foto tomada" style="display:none; max-width:320px; border:1px solid #ccc; border-radius:8px; margin-top:10px;" />
        <button id="btnFoto" class="btn btn-primary mt-2" style="display:none;">Tomar foto</button>
    </div>

    <script src="geo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@9.0.0/dist/pouchdb.min.js"></script>
    <script src="app.js"></script>
    <script src="photo.js"></script>
</body>

</html>
